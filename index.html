<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Millionaire</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <div id="app"></div>

  <script src="src/questions.js"></script>

  <!-- Model (game logic, i18n, state) -->
  <script src="src/model.js"></script>
  <!-- UI (rendering, events) -->
  <script src="src/ui.js"></script>
  
  <script>
  /*document.body.insertAdjacentHTML(
  "beforeend",
  `<pre style="position:fixed;bottom:0;left:0;background:white;color:black;
               padding:10px;z-index:99999">
    WakeLock supported: ${"wakeLock" in navigator}
  </pre>`
);*/

let wakeLock = null;

function debug(msg) {
  let el = document.getElementById("wake-debug");

  if (!el) {
    el = document.createElement("div");
    el.id = "wake-debug";
    Object.assign(el.style, {
      position: "fixed",
      bottom: "10px",
      left: "10px",
      zIndex: 999999,
      background: "#000",
      color: "#0f0",
      padding: "8px",
      font: "14px monospace"
    });
    document.body.appendChild(el);
  }

  el.textContent = msg;
}

async function requestWakeLock() {
  try {
    wakeLock = await navigator.wakeLock.request("screen");

    debug("Wake lock ACTIVE");

    wakeLock.addEventListener("release", () => {
      wakeLock = null;
      debug("Wake lock RELEASED");
    });

  } catch (err) {
    debug(`Wake lock FAILED: ${err.name} - ${err.message}`);
  }
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && !wakeLock) {
    requestWakeLock();
  }
});

requestWakeLock();
</script>
  
</body>
</html>
