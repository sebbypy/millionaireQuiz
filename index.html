<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />

  <title>Millionaire</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <div id="app"></div>

  <script src="src/questions.js"></script>

  <!-- Model (game logic, i18n, state) -->
  <script src="src/model.js"></script>
  <!-- UI (rendering, events) -->
  <script src="src/ui.js"></script>
  
  <script>
  /*document.body.insertAdjacentHTML(
  "beforeend",
  `<pre style="position:fixed;bottom:0;left:0;background:white;color:black;
               padding:10px;z-index:99999">
    WakeLock supported: ${"wakeLock" in navigator}
  </pre>`
);*/

let wakeLock = null;

async function requestWakeLock() {
  try {
    wakeLock = await navigator.wakeLock.request("screen");

    console.log("Screen wake lock active");

    wakeLock.addEventListener("release", () => {
      wakeLock = null;
      console.log("Screen wake lock released");
    });
  } catch (err) {
    console.error("Wake lock failed:", err);
  }
}

// Acquire when the app starts
requestWakeLock();

// Safari may release it when the app/tab becomes inactive.
// Acquire it again when the page becomes visible.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && !wakeLock) {
    requestWakeLock();
  }
});
</script>
  
</body>
</html>
